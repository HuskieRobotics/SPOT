name: CI

on:
  pull_request:
  push:
    branches: [v6, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      MONGOMS_DOWNLOAD_DIR: /home/runner/.cache/mongodb-binaries
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund
      # mongodb-memory-server downloads a mongod binary on first use; keep it between runs.
      - uses: actions/cache@v4
        with:
          path: /home/runner/.cache/mongodb-binaries
          key: mongod-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: End-to-end
        run: npm run test:e2e
        env:
          CI: true
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
      # A module screenshot that is missing is written by the run, which fails (#392). Download
      # this into tests/e2e/__screenshots__ and commit it (README.md, "Screenshots").
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: screenshots
          path: tests/e2e/__screenshots__
          if-no-files-found: ignore
          retention-days: 7
