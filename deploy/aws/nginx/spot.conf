# SPOT behind nginx (#412; deploy/aws/README.md). Copied to /etc/nginx/sites-available/spot with
# spot.example.org replaced by the server's name. tests/unit/deploy.test.ts checks the settings
# the comments explain.

upstream spot {
    server 127.0.0.1:3000;
    keepalive 16;
}

# Port 80: certbot's renewal checks, and everyone else sent to HTTPS.
server {
    listen 80;
    listen [::]:80;
    server_name spot.example.org;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    # `http2` here is what nginx 1.24 (Ubuntu 24.04) understands; later versions warn but accept it.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name spot.example.org;

    ssl_certificate /etc/letsencrypt/live/spot.example.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/spot.example.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # A batch of up to 50 scouted matches.
    client_max_body_size 5m;

    # Every location inherits these only because none sets its own proxy_set_header.
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    # The admin cookie is Secure only when SPOT knows the request came over HTTPS (SEC-4a).
    proxy_set_header X-Forwarded-Proto $scheme;

    # The scouters' streams (ADR 0001): passed on as they are written, and left open while a
    # scouter is signed in. A 20 s heartbeat keeps them busy; an hour is far above it.
    location /api/scouter/stream {
        proxy_pass http://spot;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    location / {
        proxy_pass http://spot;
    }
}
